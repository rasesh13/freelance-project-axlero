# ==============================================================================
# WORKVERSE PLATFORM — PRODUCTION DOCKER COMPOSE ORCHESTRATION
# ==============================================================================

version: '3.8'

services:
  workverse-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workverse-platform
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=workverse_production_super_secret_jwt_key_2026
      - CORS_ORIGIN=http://localhost:5173
    volumes:
      - workverse-data:/app/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  workverse-data:
    driver: local

name: Workverse CI Platform Verification

on:
  push:
    branches: [main, rasesh, vinita]

  pull_request:
    branches: [main, rasesh]

jobs:
  verify:
    name: Build & Verify (Node 22.x)
    runs-on: ubuntu-latest

    # Keep demo seed records available during CI database tests.
    env:
      WORKVERSE_SEED_DEMO_DATA: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Initialize SQLite Database
        working-directory: backend
        run: node -e "require('./db')"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Database Integrity Tests
        working-directory: backend
        run: npm run test:db

      - name: Run Backend API Tests
        working-directory: backend
        run: npm test

      - name: Build Frontend
        working-directory: frontend
        run: npm run build